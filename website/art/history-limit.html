<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift — history limit</title>
<style>
  :root {
    --bg: #F9F9F7; --surface: #EDEEE9; --line: #E3E5DF; --text: #11120F;
    --muted: #72776D; --accent: #FFCC4A; --ink: #17180F;
    --font: "Spline Sans", Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: var(--font); }
  .stage { width: min(980px, 94vw); padding: 40px 0; }
  .head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 28px; gap: 16px; }
  h1 { margin: 0; font-size: clamp(24px, 3.4vw, 36px); letter-spacing: -0.03em; line-height: 1.05; }
  .counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; white-space: nowrap; }
  .counter b { color: var(--text); font-size: 22px; }

  .months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; position: relative; }
  .month { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px 12px; position: relative; overflow: hidden;
           opacity: 0; transform: translateY(10px); transition: opacity .4s, transform .4s, filter .6s; }
  .month.shown { opacity: 1; transform: none; }
  .month h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .day { aspect-ratio: 1; border-radius: 4px; background: var(--surface); transition: background .25s, transform .25s; }
  .day.empty { background: transparent; }
  .day.lift { background: var(--accent); transform: scale(1.08); }
  .day.today { outline: 2px solid var(--ink); outline-offset: 1px; }

  .month .lock { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(249,249,247,.55);
                 opacity: 0; transition: opacity .5s; }
  .month .lock svg { width: 26px; height: 26px; }
  .month.locked .days, .month.locked h2 { filter: grayscale(1) blur(2.5px); opacity: .45; transition: filter .6s, opacity .6s; }
  .month.locked .lock { opacity: 1; }

  .window { position: absolute; top: -10px; bottom: -10px; border: 2px solid var(--ink); border-radius: 22px; pointer-events: none;
            transition: left .7s cubic-bezier(.6,0,.2,1), width .7s cubic-bezier(.6,0,.2,1), opacity .4s; opacity: 0; }
  .window span { position: absolute; top: -13px; left: 16px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 600;
                 padding: 4px 10px; border-radius: 999px; white-space: nowrap; }

  .foot { margin-top: 34px; display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 48px; }
  .note { color: var(--muted); font-size: 15px; max-width: 52ch; }
  .cta { background: var(--accent); color: var(--ink); font-weight: 700; border-radius: 999px; padding: 13px 22px; font-size: 15px;
         opacity: 0; transform: scale(.9); transition: opacity .4s, transform .4s cubic-bezier(.3,1.6,.5,1); white-space: nowrap; }
  .cta.on { opacity: 1; transform: none; }

  @media (max-width: 700px) { .months { grid-template-columns: repeat(3, 1fr); } .window { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="head">
    <h1>Your history keeps growing.<br>Free shows the last 3 months.</h1>
    <div class="counter"><b id="count">0</b> workouts logged</div>
  </div>
  <div class="months" id="months"><div class="window" id="win"><span>Free · last 3 months</span></div></div>
  <div class="foot">
    <div class="note" id="note">Every workout is saved. Older months stay on your account, just out of view.</div>
    <div class="cta" id="cta">Unlock full history</div>
  </div>
</div>
<script>
  const FREE = 3                          // months visible on free tier
  const START = new Date(2026, 3, 1)      // Apr 2026 → Sep 2026
  const N = 6, STEP = 45, HOLD = 3200
  const lock = '<svg viewBox="0 0 24 24" fill="none" stroke="#17180F" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
  const root = document.getElementById('months'), win = document.getElementById('win')
  const countEl = document.getElementById('count'), cta = document.getElementById('cta')

  // deterministic ~4 workouts/week (Mon/Tue/Thu/Sat + occasional extra)
  const isLift = (d) => [1, 2, 4, 6].includes(d.getDay()) ? (d.getDate() * 7) % 11 !== 0 : (d.getDate() * 5) % 13 === 0

  const months = [], timeline = []
  for (let m = 0; m < N; m++) {
    const first = new Date(START.getFullYear(), START.getMonth() + m, 1)
    const el = document.createElement('div')
    el.className = 'month'
    el.innerHTML = `<h2>${first.toLocaleString('en', { month: 'long' })}</h2><div class="days"></div><div class="lock">${lock}</div>`
    const grid = el.querySelector('.days')
    for (let i = 0; i < first.getDay(); i++) grid.insertAdjacentHTML('beforeend', '<div class="day empty"></div>')
    const len = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate()
    for (let d = 1; d <= len; d++) {
      const cell = document.createElement('div')
      cell.className = 'day'
      grid.append(cell)
      timeline.push({ m, cell, lift: isLift(new Date(first.getFullYear(), first.getMonth(), d)) })
    }
    root.append(el)
    months.push(el)
  }

  function placeWindow(lastMonth) {
    const from = Math.max(0, lastMonth - FREE + 1)
    const a = months[from], b = months[lastMonth]
    win.style.left = (a.offsetLeft - 10) + 'px'
    win.style.width = (b.offsetLeft + b.offsetWidth - a.offsetLeft + 20) + 'px'
    win.style.opacity = 1
  }

  function run() {
    let i = 0, count = 0, cur = -1, prev = null
    months.forEach(el => el.classList.remove('shown', 'locked'))
    timeline.forEach(t => t.cell.classList.remove('lift', 'today'))
    win.style.opacity = 0; cta.classList.remove('on'); countEl.textContent = 0

    const tick = setInterval(() => {
      if (i >= timeline.length) {
        clearInterval(tick)
        prev?.classList.remove('today')
        cta.classList.add('on')
        return setTimeout(run, HOLD)
      }
      const t = timeline[i++]
      if (t.m !== cur) {
        cur = t.m
        months[cur].classList.add('shown')
        if (cur >= FREE) months[cur - FREE].classList.add('locked')
        placeWindow(cur)
      }
      prev?.classList.remove('today')
      t.cell.classList.add('today'); prev = t.cell
      if (t.lift) { t.cell.classList.add('lift'); countEl.textContent = ++count }
    }, STEP)
  }
  addEventListener('resize', () => months.some(m => m.classList.contains('shown')) && placeWindow(months.filter(m => m.classList.contains('shown')).length - 1))
  run()
</script>
</body>
</html>
